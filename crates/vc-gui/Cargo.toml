[package]
name = "vc-gui"
version.workspace = true
edition.workspace = true
description = "VideoCleaning — лёгкий видеоредактор для удаления текста с 2D-анимации"

[[bin]]
name = "videocleaning"
path = "src/main.rs"

[dependencies]
vc-core = { path = "../vc-core" }
vc-codec = { path = "../vc-codec" }
vc-inpaint = { path = "../vc-inpaint" }
vc-detect = { path = "../vc-detect" }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
